<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>鼠鼠大作战</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background-color: #edddc5;
        background-image: radial-gradient(#d6bfa4 1px, transparent 1px);
        background-size: 12px 12px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        box-shadow: 0 0 50px #453d4424;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
